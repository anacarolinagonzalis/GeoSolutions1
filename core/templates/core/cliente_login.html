<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Cliente | GeoSolutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #12341e 0%, #1f4e2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            text-align: center;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #12341e;
            margin-bottom: 4px;
        }

        .brand-title span {
            color: #2e8b57;
        }

        .brand-subtitle {
            font-size: 0.85rem;
            color: #666666;
            margin-bottom: 28px;
            font-weight: 600;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #12341e;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e8e2;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #2e8b57;
        }

        .error-message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .btn-submit {
            width: 100%;
            background-color: #12341e;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #2e8b57;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="brand-title"><span>Geo</span>Solutions</h1>
        <p class="brand-subtitle">Moriah Geotecnologia & Gestão Ambiental</p>

        {% if form.errors %}
            <div class="error-message">
                Usuário ou senha incorretos. Por favor, tente novamente.
            </div>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Usuário</label>
                <input type="text" name="username" id="id_username" required autofocus placeholder="Digite seu usuário">
            </div>

            <div class="form-group">
                <label for="id_password">Senha</label>
                <input type="password" name="password" id="id_password" required placeholder="Digite sua senha">
            </div>

            <button type="submit" class="btn-submit">Acessar Área do Cliente</button>
        </form>
    </div>

</body>
</html>
