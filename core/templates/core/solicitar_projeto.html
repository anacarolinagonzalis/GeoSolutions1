<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Solicitação - GeoSolutions</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background-color: #f4f8f5; color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card-form { background: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); width: 100%; max-width: 580px; padding: 35px; border-top: 6px solid #12341e; }
        .card-title { font-size: 1.6rem; font-weight: 800; color: #12341e; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 700; color: #12341e; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 8px; }
        input[type="text"], select, textarea { width: 100%; padding: 12px 14px; border: 2px solid #d0e2d4; border-radius: 8px; font-size: 0.9rem; background-color: #f8faf9; transition: border-color 0.2s; }
        input[type="text"]:focus, select:focus, textarea:focus { border-color: #12341e; outline: none; background-color: #ffffff; }
        textarea { resize: vertical; min-height: 110px; }
        .btn-submit { background-color: #12341e; color: #ffffff; border: none; padding: 14px 20px; border-radius: 8px; width: 100%; font-size: 0.88rem; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: background-color 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-submit:hover { background-color: #1f4e2d; }
        .btn-back { display: inline-block; margin-top: 20px; color: #12341e; text-decoration: none; font-weight: 700; font-size: 0.85rem; }
        .btn-back:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card-form">
        <h1 class="card-title">Nova Solicitação de Projeto</h1>

        <form method="post" action="{% url 'solicitar_projeto' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="tipo_servico">Tipo de Serviço Desejado:</label>
                <select name="tipo_servico" id="tipo_servico" required>
                    <option value="" disabled selected>Selecione o tipo de serviço...</option>
                    <option value="LICENCIAMENTO">📜 Licenciamento Ambiental</option>
                    <option value="LAUDO_TECNICO">📄 Laudo Técnico Ambiental</option>
                    <option value="ESTUDO_IMPACTO">🌳 Estudo de Impacto Ambiental (EIA/RIMA)</option>
                    <option value="OUTROS">🍃 Outros Serviços Ambientais</option>
                    <option value="FALE_CONOSCO">💬 Fale Conosco / Dúvidas Gerais</option>
                </select>
            </div>

            <div class="form-group">
                <label for="titulo">Título / Assunto da Demanda:</label>
                <input type="text" name="titulo" id="titulo" placeholder="Ex: Licenciamento do Empreendimento X" required>
            </div>

            <div class="form-group">
                <label for="descricao">Descrição das Necessidades:</label>
                <textarea name="descricao" id="descricao" placeholder="Descreva os detalhes da sua necessidade ou mensagem..."></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar Solicitação</button>
        </form>

        <a href="{% url 'painel_cliente' %}" class="btn-back">← Voltar ao Painel</a>
    </div>

</body>
</html>
